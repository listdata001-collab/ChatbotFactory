services:
  - type: web
    name: botfactory-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SESSION_SECRET
        generateValue: true
      # DATABASE_URL is provided manually via Render dashboard
      # Expected format (Neon): postgresql://user:pass@ep-xxx-pooler.region.aws.neon.tech/db?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: START_BOT_MANAGER
        value: "false"
      - key: ALLOW_LEGACY_TELEGRAM_WEBHOOKS
        value: "false"
